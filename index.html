<body>
<title>냉장고 털기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling content, fixed bottom tab bar, sheets that slide over it. Prices sit on yellow price-tag stickers. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#16201B; --muted:#5E6B65; --line:#D6DED9;
  --go:#1E6B48; --go-ink:#FFFFFF; --go-soft:#DCEFE4;
  --tag:#FFD43B; --tag-ink:#2A2200;
  --warn:#B35C00; --warn-soft:#FFEBD2; --bad:#B3261E; --bad-soft:#FBDAD7;
  --info:#2F5D8C; --info-soft:#DDE8F4;
  --scrim:rgba(14,22,18,.45);
  --cat-meal:#E1EFE6; --cat-meal-ink:#1E6B48; --cat-ramen:#FBE7D3; --cat-ramen-ink:#9A4A12;
  --cat-side:#E0E9F3; --cat-side-ink:#2F5D8C; --cat-sweet:#F7E1EA; --cat-sweet-ink:#94385F;
  --shadow:rgba(14,22,18,.18); --toast-act:#FFD43B;
  --tabh:calc(66px + env(safe-area-inset-bottom,0px));
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#1A201D; --ink:#E6ECE9; --muted:#9AA8A1; --line:#2C3531;
  --go:#58BF8B; --go-ink:#0B1E14; --go-soft:#1D3328;
  --tag:#F2C83A; --tag-ink:#231C00;
  --warn:#FFB45E; --warn-soft:#3A2810; --bad:#FF8A80; --bad-soft:#3D1C1A;
  --info:#8DB8E8; --info-soft:#1A2836;
  --cat-meal:#1D3328; --cat-meal-ink:#7FD1A6; --cat-ramen:#3A2614; --cat-ramen-ink:#F2A86B;
  --cat-side:#1A2836; --cat-side-ink:#9CC3EE; --cat-sweet:#3A1E2B; --cat-sweet-ink:#F09CC2;
  --shadow:rgba(0,0,0,.5); --toast-act:#17583A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#1A201D; --ink:#E6ECE9; --muted:#9AA8A1; --line:#2C3531;
  --go:#58BF8B; --go-ink:#0B1E14; --go-soft:#1D3328;
  --tag:#F2C83A; --tag-ink:#231C00;
  --warn:#FFB45E; --warn-soft:#3A2810; --bad:#FF8A80; --bad-soft:#3D1C1A;
  --info:#8DB8E8; --info-soft:#1A2836;
  --cat-meal:#1D3328; --cat-meal-ink:#7FD1A6; --cat-ramen:#3A2614; --cat-ramen-ink:#F2A86B;
  --cat-side:#1A2836; --cat-side-ink:#9CC3EE; --cat-sweet:#3A1E2B; --cat-sweet-ink:#F09CC2;
  --shadow:rgba(0,0,0,.5); --toast-act:#17583A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 30px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:box-shadow .15s}
header.sh{box-shadow:0 1px 0 var(--line)}
header > div{min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0;letter-spacing:.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px;min-height:19px}
.hright{display:flex;align-items:center;gap:8px;flex:none}
.sync{font-size:11.5px;color:var(--warn);font-weight:700;white-space:nowrap}
.hbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;border:0;background:none;padding:7px 2px 9px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;min-width:0}
.tabs button[aria-selected="true"]{color:var(--go)}
.tabs .ti{position:relative;width:54px;height:30px;border-radius:999px;display:grid;place-items:center}
.tabs .ti svg{width:23px;height:23px}
.tabs button[aria-selected="true"] .ti{background:var(--go-soft)}
.tabs button[aria-selected="true"] .tl{font-weight:700}
.badge{position:absolute;top:-4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font:700 11px/18px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.badge.warn{background:var(--warn);color:var(--surface)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:4px 10px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:8px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:7px 13px;min-height:36px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;min-height:36px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);min-width:0}
.srow{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.srow .search{flex:1}
.sortsel{width:auto;flex:none;background:var(--surface);border-radius:12px;font-size:14px;padding:9px 8px}
.addbox{margin-bottom:6px}
.addsum{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--go);color:var(--go-ink);border-radius:12px;padding:12px 14px;font-weight:700}
.addsum::-webkit-details-marker{display:none}
.addsum .why{color:var(--go-ink);opacity:.85;font-weight:500}
.addbox[open] .addsum{border-radius:12px}
.mini{font-size:12px;color:var(--muted);margin:-2px 0 10px}
.mini b{color:var(--ink)}
.nextprev{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.sheet .seg{align-self:flex-start}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn{display:inline-flex;align-items:center;cursor:pointer;position:relative}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.open{border-color:var(--go)}
.ctop{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.rhead{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-radius:8px;min-width:0}
.rhead:focus-visible{outline:2px solid var(--go);outline-offset:4px}
.rhead > div{min-width:0}
.rname{font-weight:700;font-size:17px;margin:0;text-wrap:balance}
.rmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.heart{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.heart svg{width:20px;height:20px}
.heart[aria-pressed="true"]{color:var(--bad)}
.tagbox{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.tag{background:var(--tag);color:var(--tag-ink);font-family:var(--display);font-size:19px;line-height:1;padding:9px 12px 8px 18px;border-radius:4px 10px 10px 4px;position:relative;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.tag.free{background:var(--go);color:var(--go-ink)}
.tag small{font-family:var(--body);font-size:11px;font-weight:600;margin-left:2px}
.tagnote{font-size:11px;color:var(--muted);white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--go-soft);color:var(--go)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.bad{background:var(--bad-soft);color:var(--bad)}
.b.info{background:var(--info-soft);color:var(--info)}
.b.plain{background:var(--bg);color:var(--muted)}
.have{font-size:13px;color:var(--muted)}
.have b{color:var(--ink);font-weight:600}
.miss{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding-block:9px;border-bottom:1px dashed var(--line)}
.mrow.nochk{grid-template-columns:1fr auto}
.mrow:last-child{border-bottom:0}
.mrow .nm{font-weight:600;min-width:0}
.mrow .dt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.mrow .dt.left{color:var(--warn)}
.mrow .txt{min-width:0;display:flex;flex-direction:column}
.mrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--go)}
.mrow.done .nm{text-decoration:line-through;color:var(--muted)}
.buys{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.buy{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:8px 11px;border-radius:9px;white-space:nowrap}
.buy span{opacity:.85;font-weight:500}
.alt{font-size:12px;color:var(--info);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;padding:11px}
.btn.sm{padding:5px 10px;min-height:34px;font-size:12.5px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.nutri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.nutri div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:11.5px;color:var(--muted);font-weight:600}
.nutri b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.subh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.ingl{display:flex;flex-wrap:wrap;gap:6px}
.ing{font-size:13px;padding:3px 8px;border-radius:7px;background:var(--bg);display:inline-flex;gap:5px;align-items:baseline}
.ing i{font-style:normal;font-size:11px;font-weight:700}
.ing.ok i{color:var(--go)} .ing.no i{color:var(--bad)} .ing.opt i{color:var(--muted)} .ing.sub i{color:var(--info)} .ing.pan i{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .num{font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.tile .tl{font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile.go .num{color:var(--go)} .tile.warn .num{color:var(--warn)} .tile.info .num{color:var(--info)}
.banner{border-radius:12px;padding:9px 10px 9px 13px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.go{background:var(--go-soft);color:var(--ink)}
.banner.info{background:var(--info-soft);color:var(--ink)}
.banner b{font-weight:700}
.banner .bt{min-width:0;flex:1 1 auto}
.banner > .btn,.banner > .acts{flex:none}
.banner .acts{flex-wrap:nowrap;gap:6px;align-items:center}
.ic.x{width:34px;height:34px;font-size:15px;background:transparent;border-color:transparent;color:var(--muted)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note b{color:var(--ink)}
select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 8px;font-size:15px;color:var(--ink);width:100%;min-width:0}
textarea.inp{resize:vertical;line-height:1.5}
.bars{display:flex;flex-direction:column;gap:9px}
.nb{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.nb .v{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;font-size:12px}
.nb .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.nb .fill{height:100%;background:var(--go);border-radius:4px}
.nb.over .fill{background:var(--bad)}
.nb.near .fill{background:var(--warn)}
.entry{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.entry:last-child{border-bottom:0}
.entry .sl{font-size:12px;font-weight:700;color:var(--go)}
.entry .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.add label,.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
form.add .full{grid-column:1 / -1}
.amt{display:flex;gap:6px}
.amt input{flex:1}
.amt .u{align-self:center;color:var(--ink);font-weight:600;min-width:20px}
.hint{font-size:12px;color:var(--muted);grid-column:1 / -1}
.qadd{display:flex;flex-wrap:wrap;gap:6px;grid-column:1 / -1}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ibtn{all:unset;cursor:pointer;min-width:0;border-radius:6px}
.ibtn:focus-visible{outline:2px solid var(--go);outline-offset:3px}
.dd{font-family:var(--display);font-size:15px;width:52px;text-align:center;padding:7px 0 6px;border-radius:8px;background:var(--go-soft);color:var(--go);font-variant-numeric:tabular-nums}
.dd.soon{background:var(--warn-soft);color:var(--warn)}
.dd.over{background:var(--bad-soft);color:var(--bad)}
.dd.ice{background:var(--info-soft);color:var(--info)}
.item .t{font-weight:600}
.item .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .ctl{display:flex;gap:4px}
.ic{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:40px;height:40px;font-size:17px;line-height:1;display:grid;place-items:center;flex:none}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.edit .full{grid-column:1 / -1}
.tip{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.sect{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fg{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.05em}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}

});

function toRecipe(c){
  const ings=(c.ings||[]).filter(g=>CM[g.n]&&g.a>0).map(g=>({n:g.n,a:+g.a}));

function niceFrac(x){
  const w=Math.floor(x+1e-9),f=x-w;
  const fr=w===0?[[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]]:[[0,""],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
  let b=fr[0],bd=9;for(const p of fr){const d=Math.abs(f-p[0]);if(d<bd){bd=d;b=p}}
  if(b[0]===1)return String(w+1);
  if(b[0]===0)return w?String(w):"⅛";
  return (w?String(w):"")+b[1];
}
function half(x){const h=Math.round(x*2)/2,w=Math.floor(h);return ((w?String(w):"")+(h-w?"½":""))||"½"}

function sanitize(d){
  const o={};
  if(Array.isArray(d.items)){o.items=[];for(const x of d.items){if(!x||!x.name||!x.expiry)continue;
    const parts=String(x.name).split(/\s*[,，、·\/]\s*/).filter(Boolean);
    if(parts.length>1&&parts.every(p=>CM[p]||matchName(p))){for(const p of parts){const n=CM[p]?p:matchName(p),c=CM[n];o.items.push({...x,id:x.id+"-"+n,name:n,unit:c.u,amount:x.unit===c.u?x.amount:defaultAdd(n)})}}
    else o.items.push({...x})}}
  if(d.meals&&typeof d.meals==="object"){o.meals={};for(const [k,v] of Object.entries(d.meals))if(Array.isArray(v))o.meals[k]=v.map(x=>({...x}))}
  for(const k of ["cart","cartExtra","custom","pantry","favs","avoid","purchases","waste"])if(Array.isArray(d[k]))o[k]=JSON.parse(JSON.stringify(d[k]));
  if(d.plan===null||(d.plan&&Array.isArray(d.plan.slots)))o.plan=d.plan?JSON.parse(JSON.stringify(d.plan)):null;
  if(typeof d.budget==="number")o.budget=d.budget;
  if(d.profile&&PROFILES[d.profile])o.profile=d.profile;
  if(typeof d.skipGarnish==="boolean")o.skipGarnish=d.skipGarnish;
  if(typeof d.allowSubs==="boolean")o.allowSubs=d.allowSubs;
  if(d.rice==="pot"||d.rice==="instant")o.rice=d.rice;
  if(typeof d.lastCheck==="string")o.lastCheck=d.lastCheck;
  for(const k of ["rates","notes","cartChecked","myPrice"])if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k]))o[k]={...d[k]};
  return o;
}

let dbRef=null,writing=false,pending=false,saveTimer=null;
function persist(){
  prune();
  writeLS(LSK,{...S,example:isExample});
  if(!dbRef)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(writing){pending=true;return}
  writing=true;
  try{await dbRef.set({...S,items:isExample?[]:S.items,updated:Date.now()})}catch(e){setSync("저장 실패 · 이 기기에만 저장됨")}
  writing=false;
  if(pending){pending=false;flush()}
}
let SYNC="이 기기에 저장";
function setSync(t){SYNC=t;const el=$("sync");const warn=/실패|지연/.test(t);el.hidden=!warn;el.textContent=warn?(t.includes("실패")?"저장 실패":"연결 지연"):""}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbRef=db.doc("data/users/"+id+"/fridge");
    setSync("불러오는 중…");
    const timer=setTimeout(()=>setSync("계정 연결 지연 · 이 기기 데이터 표시"),10000);
    let first=true;
    dbRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(timer);
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        const d=sanitize(snap.data()||{});
        if(d.items&&!d.items.length&&isExample)delete d.items; else if(d.items)isExample=false;
        Object.assign(S,d);rebuildRecipes();
        writeLS(LSK,{...S,example:isExample});
        render();
      }else if(first&&!snap.metadata.fromCache){flush()}
      if(!snap.metadata.fromCache){first=false;setSync("내 계정에 저장")}
    },()=>{clearTimeout(timer);dbRef=null;setSync("이 기기에 저장")});
  }catch(e){}
}

  for(const s of SUB[n]||[]){const c2=CM[s];if(!c2||c2.u!==c.u)continue;if(isPantry(s)||(availFn||avail)(s)>=want-1e-9)return s}
  return null;
}
// 내가 실제로 산 가격이 있으면 그 비율로 예상가를 고쳐요
function priceF(c){const m=S.myPrice&&S.myPrice[c.n];if(!m||!(m.u>0))return 1;const base=c.opts[0].price/c.opts[0].size;return Math.max(0.4,Math.min(2.5,m.u/base))}
function learnPrice(n,price,amt){
  const c=CM[n];if(!c||!(price>0)||!(amt>0))return;
  const u=price/amt,base=c.opts[0].price/c.opts[0].size,ratio=u/base;
  if(ratio<0.25||ratio>4)return;
  const prev=S.myPrice[n];S.myPrice[n]={u:prev&&prev.u>0?prev.u*0.4+u*0.6:u,d:todayStr()};
}
function bestBuy(c,need){
  let best=null;const pf=priceF(c);
  for(const o of c.opts){
    const k=Math.ceil(need/o.size-1e-9),cost=Math.round(k*o.price*pf/10)*10,left=k*o.size-need;
    if(!best||cost<best.cost||(cost===best.cost&&left<best.left))best={o,k,cost,left};
  }
  const unit=best.o.price*pf/best.o.size;best.mine=pf!==1;
  const risk=c.shelf<=7?0.6:c.shelf<=14?0.35:c.shelf<=30?0.15:0;
  best.risk=risk;best.waste=best.left*unit*risk;best.real=need*unit+best.waste;

}
const estPrice=(n,amt)=>CM[n]?bestBuy(CM[n],amt).cost:0;
function nutOf(r,serv=1){
  const t={kcal:0,p:0,fat:0,na:0,fib:0};
  for(const g of r.ings){const c=CM[g.n];if(!c)continue;const f=(c.u==="g"?g.a/100:g.a)*serv;
    t.kcal+=c.nut[0]*f;t.p+=c.nut[1]*f;t.fat+=c.nut[2]*f;t.na+=c.nut[3]*f;t.fib+=c.nut[4]*f}
  return t;
}
function rebuildRecipes(){
  applyRice();
  const custom=(S.custom||[]).map(toRecipe).filter(r=>r.ings.length&&!BASE_R.some(b=>b.name===r.name));
  R=BASE_R.concat(custom);RM=Object.fromEntries(R.map(r=>[r.name,r]));

}
function foodNut(food,serv){
  if(food.startsWith("r:")){const n=NUT[food.slice(2)];if(!n)return null;return {kcal:n.kcal*serv,p:n.p*serv,fat:n.fat*serv,na:n.na*serv,fib:n.fib*serv}}
  const o=OUT[food.slice(2)];if(!o)return null;
  return {kcal:o[0]*serv,p:o[1]*serv,fat:o[2]*serv,na:o[3]*serv,fib:o[4]*serv};
}
const prof=()=>PROFILES[S.profile]||PROFILES["19-29"];
function todayState(){
  const P=prof();
  const es=S.meals[todayStr()]||[];
  const E={kcal:0,p:0,fat:0,na:0,fib:0};
  for(const e of es){const n=foodNut(e.food,e.serv||1);if(n)for(const k in E)E[k]+=n[k]}
  const mainDone=new Set(es.filter(e=>e.slot!=="s").map(e=>e.slot)).size;
  const left=Math.max(1,3-mainDone);
  const ideal={kcal:Math.max(0,P.kcal-E.kcal)/left,p:Math.max(0,P.p-E.p)/left,fib:Math.max(0,P.fib-E.fib)/left,na:Math.max(0,P.na-E.na)/left,fat:Math.max(0,P.fat-E.fat)/left};
  return {P,E,es,mainDone,left,ideal};
}
function nutriBonus(n,I){
  const b=45*Math.min(n.p,I.p)+90*Math.min(n.fib,I.fib)-0.9*Math.max(0,n.na-I.na)-1.5*Math.max(0,n.kcal-1.25*I.kcal)-15*Math.max(0,n.fat-1.2*I.fat);
  return Math.max(-3000,Math.min(3000,b));
}
function avoided(r){return r.ings.some(g=>S.avoid.includes(g.n)&&!isGarnish(g))}
function analyze(r,serv,ts){
  let outlay=0,real=0,req=0,haveN=0;
  const missing=[],have=[],soon=[],opt=[],subs=[],pan=[];
  for(const g of r.ings){
    const c=CM[g.n];if(!c)continue;
    if(S.avoid.includes(g.n)&&isGarnish(g))continue;
    const want=g.a*serv;
    if(isPantry(g.n)){pan.push(g.n);continue}
    const st=STOCK[g.n];
    if(st&&st.minD<=2)soon.push(g.n);
    const garn=S.skipGarnish&&isGarnish(g);
    if(!garn)req++;
    if(avail(g.n)>=want-1e-9){have.push(g.n);if(!garn)haveN++;continue}
    if(garn){opt.push(g.n);continue}
    if(S.allowSubs){const s=findSub(g.n,want);if(s){subs.push({from:g.n,to:s});haveN++;continue}}
    const need=want-avail(g.n);
    const bb=bestBuy(c,need);
    outlay+=bb.cost;real+=bb.real;missing.push({c,need,bb});
  }
  missing.sort((a,b)=>b.bb.cost-a.bb.cost);
  const n1=NUT[r.name]||nutOf(r,1);
  const bonus=nutriBonus(n1,ts.ideal);
  const fav=S.favs.includes(r.name);
  const rec=RECENT[r.name],rate=S.rates[r.name]||0;
  const rank=0.6*outlay+0.4*real-bonus-300*soon.length-(fav?300:0)+(rec!=null?[2000,1200,500,200][rec]:0)+(rate<0?5000:rate>0?-400:0);
  return {r,outlay,real,perServing:real/serv,missing,have,soon,opt,subs,pan,req,haveN,bonus,rank,n1,fav,rec,rate};
}

function addItem(n,amt,opt={}){
  if(isExample){S.items=[];isExample=false}
  const c=CM[n];const t=opt.bought||todayStr();
  S.items.push({id:uid(),name:n,amount:r1(amt),unit:c?c.u:"g",bought:t,expiry:opt.expiry||addDays(t,c?c.shelf:7)});
  if(opt.record&&c)S.purchases.push({id:uid(),date:todayStr(),name:n,amount:amt,unit:c.u,price:estPrice(n,amt)});
}
function takeFrom(name,amount){
  let left=amount;
  for(const x of S.items.filter(x=>!x.dish&&x.name===name&&dLeft(x.expiry)>=0).sort((a,b)=>a.expiry.localeCompare(b.expiry))){
    if(left<=1e-9)break;const tk=Math.min(left,Number(x.amount));x.amount=r1(Number(x.amount)-tk);left-=tk;
  }
  return amount-left;
}
function deductRecipe(r,serv){
  const used=new Set();
  for(const g of r.ings){
    if(isPantry(g.n))continue;
    const want=g.a*serv;const got=takeFrom(g.n,want);if(got>0)used.add(g.n);
    if(got<want-1e-9&&S.allowSubs&&!isGarnish(g)){
      const s=(SUB[g.n]||[]).find(s=>CM[s]&&CM[s].u===CM[g.n].u&&!isPantry(s)&&S.items.some(x=>!x.dish&&x.name===s));
      if(s){const g2=takeFrom(s,want-got);if(g2>0)used.add(s)}
    }
  }
  S.items=S.items.filter(x=>Number(x.amount)>0.05);
  return used.size;
}
const dishShelf=r=>r.sub==="국·찌개"?3:2;
function addDish(r,amt){

}

/* =========================================================
   글로 적은 재료 읽기 ("계란 10개 양파 3개")
   ========================================================= */
function matchName(tok){
  tok=tok.replace(/(은|는|이|가|을|를|도|만|좀)$/,"").trim();
  if(!tok)return null;
  if(CM[tok])return tok;
  if(ALIAS[tok])return ALIAS[tok];
  let best=null;for(const c of CAT)if(tok.includes(c.n)&&(!best||c.n.length>best.length))best=c.n;
  if(best)return best;
  let ab=null;for(const k of Object.keys(ALIAS))if(k.length>=2&&tok.includes(k)&&(!ab||k.length>ab.length))ab=k;
  if(ab)return ALIAS[ab];
  if(tok.length>=2)for(const c of CAT)if(c.n.includes(tok))return c.n;
  return null;
}
function defaultAdd(n){if(n==="쌀"&&S.rice==="instant")return 300;return DEFAULT_ADD[n]??CM[n].opts[0].size}
function toBase(n,q,u){
  const c=CM[n],pc=PIECE[n];
  if(q==null)return defaultAdd(n);
  const wt=/^(킬로그램|킬로|kg)$/.test(u)?1000:/^(그램|g)$/.test(u)?1:/^(ml|mL)$/.test(u)?1:/^(리터|L|l)$/.test(u)?1000:u==="근"?600:0;
  if(c.u==="개"){
    if(u==="판"&&n==="계란")return q*30;
    if(wt)return r1(q*wt/(UNIT_G[n]||100));
    return q;
  }
  if(wt)return q*wt;
  if((u==="큰술"||u==="스푼")&&SPOON[n])return q*SPOON[n];
  if((u==="작은술"||u==="티스푼")&&SPOON[n])return q*SPOON[n]/3;
  if(u==="컵"&&CUPG[n])return q*CUPG[n];
  const uu=u==="봉지"?"봉":u;
  if(UNITX[n]&&UNITX[n][uu])return q*UNITX[n][uu];
  if(pc&&(uu===pc[0]||uu==="개"||uu==="알"))return q*pc[1];
  if(uu)return q*c.opts[0].size;
  if(pc&&q<20)return q*pc[1];
  if(q>=20)return q;
  return q*c.opts[0].size;
}
// 말로 넣을 때(키보드 마이크) 나오는 표현 정리: 열두 개→12개, 오백 그램→500그램, 1키로→1kg, 3개요→3개
const NATIVE=(()=>{const ones=[["하나",1],["한",1],["둘",2],["두",2],["셋",3],["세",3],["석",3],["넷",4],["네",4],["넉",4],["다섯",5],["여섯",6],["일곱",7],["여덟",8],["아홉",9]],tens=[["열",10],["스물",20],["스무",20],["서른",30],["마흔",40],["쉰",50]];
  const m=new Map(ones);for(const [t,v] of tens){m.set(t,v);if(t!=="스무")for(const [o,w] of ones)m.set(t+o,v+w)}return m})();
function sinoNum(s){if(s==="반")return 0.5;const D={일:1,이:2,삼:3,사:4,오:5,육:6,륙:6,칠:7,팔:8,구:9},M={십:10,백:100,천:1000};let t=0,c=0;for(const ch of s){if(D[ch])c=D[ch];else if(M[ch]){t+=(c||1)*M[ch];c=0}}return t+c}
function normSpeech(s){
  const nat=[...NATIVE.keys()].sort((a,b)=>b.length-a.length).join("|");
  const cnt="개|알|모|단|봉지|봉|캔|팩|통|장|줄|컵|판|근|포기|송이|묶음|인분|대|스푼|숟가락|큰술|작은술|티스푼";
  s=String(s||"").replace(new RegExp(`(^|[^가-힣])(${nat})\\s*(${cnt})`,"g"),(_,a,n,u)=>a+NATIVE.get(n)+(u==="숟가락"?"스푼":u));
  s=s.replace(/(^|[^가-힣])([일이삼사오육륙칠팔구십백천]+|반)\s*(킬로그램|킬로그람|키로그램|키로|킬로|kg|그램|그람|g|리터|밀리리터|밀리|미리|ml|mL|L|l)(?![A-Za-z])/g,(_,a,n,u)=>a+sinoNum(n)+u);
  s=s.replace(/(\d(?:\.\d+)?)\s*(키로그램|킬로그람|키로)/g,"$1kg").replace(/(\d(?:\.\d+)?)\s*그람/g,"$1그램").replace(/(\d(?:\.\d+)?)\s*(밀리리터|밀리|미리)/g,"$1ml").replace(/(\d)\s*숟가락/g,"$1스푼");
  s=s.replace(new RegExp(`(\\d(?:\\.\\d+)?\\s*(?:${UNITS.join("|")}))(?:이요|요|씩|정도|쯤|이랑|랑|하고|도|만|이나|짜리)(?![가-힣])`,"g"),"$1 ");
  return s;
}
function parseBulk(text){
  text=normSpeech(text);
  const found=[],unknown=[];
  const numAlt=Object.keys(NUMW).join("|");
  const re=new RegExp(`([가-힣A-Za-z]+)\\s*(\\d+(?:\\.\\d+)?|${numAlt})?\\s*(${UNITS.join("|")})?(?![가-힣])`,"g");
  const parts=text.replace(/그리고|이랑|하고/g,",").split(/[,\n·\/]+/);
  for(const p of parts){
    let m;re.lastIndex=0;
    const s=p.trim();if(!s)continue;
    while((m=re.exec(s))){
      if(!m[0].trim()){re.lastIndex++;continue}
      let [_,name,qty,unit]=m;
      // "한판"처럼 이름이 숫자말로 읽힌 경우는 건너뛰기
      if(NUMW[name]!==undefined&&!qty)continue;
      const n=matchName(name);
      if(!n){if(!/^(있어요?|있음|있다|있고|있는데|있습니다|샀어요?|샀고|사왔어요?|남았어요?|남았고|남음|남은|정도|약|쯤|조금|많이|좀|또|더|요|그럼|음|그냥|대충|냉장고에?|냉동실에?|집에)$/.test(name))unknown.push(name);continue}
      const q=qty==null?null:(NUMW[qty]!==undefined?NUMW[qty]:parseFloat(qty));
      const amt=toBase(n,q,unit||"");
      const prev=found[found.length-1];
      if(prev&&prev.n===n&&!prev.explicit){prev.amt=amt;prev.explicit=q!=null;continue}
      found.push({n,amt:r1(amt),explicit:q!=null,on:true});
    }
  }
  const merged=[];for(const f of found){const e=merged.find(x=>x.n===f.n);if(e)e.amt=r1(e.amt+f.amt);else merged.push(f)}
  return {items:merged,unknown:[...new Set(unknown)]};
}

/* =========================================================
   일주일 식단 자동 짜기
   남은 재료를 이어 쓰고, 빨리 상하는 것부터 쓰고, 끼니당 돈을 최소로
   ========================================================= */
const canBatch=r=>(r.sub==="국·찌개"||/카레|짜장|볶음|조림|찜|불고기|닭갈비/.test(r.name))&&r.type!=="라면"&&r.type!=="디저트"&&r.type!=="반찬"||(r.type==="반찬"&&/볶음|조림|찜|불고기|닭갈비/.test(r.name));
function planSlots(days,per){
  const order=per===1?["d"]:per===2?["l","d"]:["b","l","d"];
  const out=[];const t=todayStr();const h=nowH();
  let d=0;
  while(out.length<days*per&&d<days+2){
    const date=addDays(t,d);
    for(const s of order){if(d===0&&h>=SLOT_END[s])continue;if(out.length<days*per)out.push({date,slot:s})}
    d++;
  }
  return out;
}
function makePlan(o,forced={},exclude={},slotsIn){
  const slots=slotsIn||planSlots(o.days,o.per);
  const t0=todayStr();
  const lots=S.items.filter(x=>!x.dish&&dLeft(x.expiry)>=0).map(x=>({n:x.name,amt:Number(x.amount)||0,exp:dLeft(x.expiry)}));
  const dishes=S.items.filter(x=>x.dish&&dLeft(x.expiry)>=0).map(x=>({name:x.name,amt:Number(x.amount),exp:dLeft(x.expiry)}));
  const P=prof();const per={kcal:P.kcal/3,p:P.p/3,fib:P.fib/3,na:P.na/3};
  const cand=R.filter(r=>(r.type==="식사"||r.type==="라면"||(r.type==="반찬"&&r.ings.some(g=>g.n==="쌀")))&&!avoided(r)&&(S.rates[r.name]||0)>=0);
  const used=new Set();let ramen=0,pend=null,prevSub=null;
  const out=[];const buys={};let total=0;
  for(let i=0;i<slots.length;i++){
    const sl=slots[i];const day=Math.round((new Date(sl.date)-new Date(t0))/DAY);
    if(pend){out.push({...sl,recipe:pend,serv:1,leftover:true,cost:0});pend=null;continue}
    const dsh=dishes.find(x=>x.amt>=0.5&&x.exp>=day);
    if(dsh&&!forced[i]){dsh.amt-=1;out.push({...sl,recipe:dsh.name,serv:1,leftover:true,cost:0,fromFridge:true});continue}
    // 이 시점의 재고
    const av={},soonAmt={};
    for(const l of lots){if(l.exp<day||l.amt<=0)continue;av[l.n]=(av[l.n]||0)+l.amt;if(l.exp-day<=2)soonAmt[l.n]=(soonAmt[l.n]||0)+l.amt}
    const aFn=n=>av[n]||0;
    const evalR=(r,serv)=>{
      let cost=0,rescue=0;
      for(const g of r.ings){
        if(isPantry(g.n))continue;const c=CM[g.n];if(!c)continue;
        const want=g.a*serv;const have=aFn(g.n);
        const unit=c.opts[0].price*priceF(c)/c.opts[0].size;
        if(soonAmt[g.n])rescue+=Math.min(want,soonAmt[g.n])*unit;
        if(have>=want-1e-9)continue;
        if(isGarnish(g))continue;
        if(S.allowSubs&&findSub(g.n,want,aFn))continue;
        cost+=bestBuy(c,want-have).cost;
      }
      return {cost,rescue};
    };
    let best=null;
    const pickList=forced[i]&&RM[forced[i]]?[RM[forced[i]]]:cand;
    for(const r of pickList){
      if(!forced[i]){
        if(used.has(r.name))continue;
        if(exclude[i]&&exclude[i].includes(r.name))continue;
        if(r.type==="라면"&&(!o.ramen||ramen>=2))continue;
      }
      const batch=o.batch&&canBatch(r)&&i+1<slots.length;
      const serv=batch?2:1;
      const ev=evalR(r,serv);
      const n=NUT[r.name];
      const nut=(o.lowNa?2:0.8)*Math.max(0,n.na-per.na*(o.lowNa?0.8:1))+1.5*Math.max(0,n.kcal-1.3*per.kcal)-(o.hiP?90:40)*Math.min(n.p,per.p*(o.hiP?1.6:1))-80*Math.min(n.fib,per.fib);
      let score=ev.cost/serv-ev.rescue*0.9/serv+nut+(r.sub===prevSub?500:0)+(o.jitter?Math.random()*o.jitter:0)+(RECENT[r.name]!=null&&RECENT[r.name]<=1?800:0)-((S.rates[r.name]||0)>0?300:0);
      if(!best||score<best.score)best={r,serv,batch,score};
    }
    if(!best){out.push({...sl,recipe:null});continue}
    // 적용: 재고 쓰고, 부족하면 사서 남은 건 재고로
    let cost=0;const subsUsed=[],bought=[];
    for(const g of best.r.ings){
      if(isPantry(g.n))continue;const c=CM[g.n];if(!c)continue;
      let want=g.a*best.serv;
      const take=(name,amt)=>{let left=amt;for(const l of lots.filter(l=>l.n===name&&l.exp>=day&&l.amt>0).sort((a,b)=>a.exp-b.exp)){const k=Math.min(left,l.amt);l.amt-=k;left-=k;if(left<=1e-9)break}return amt-left};
      want-=take(g.n,want);
      if(want<=1e-9)continue;
      if(isGarnish(g))continue;
      if(S.allowSubs){const s=findSub(g.n,want,aFn);if(s){if(!isPantry(s))take(s,want);subsUsed.push(`${g.n} 대신 ${s}`);continue}}
      const bb=bestBuy(c,want);cost+=bb.cost;bought.push(g.n);
      const b=buys[g.n]||(buys[g.n]={amt:0,cost:0});b.amt+=bb.k*bb.o.size;b.cost+=bb.cost;
      if(bb.left>0)lots.push({n:g.n,amt:bb.left,exp:day+c.shelf,bought:true});
    }
    total+=cost;used.add(best.r.name);if(best.r.type==="라면")ramen++;prevSub=best.r.sub;
    out.push({...sl,recipe:best.r.name,serv:best.serv,batch:best.batch,cost,subs:subsUsed,buy:bought});
    if(best.batch)pend=best.r.name;
  }
  const lastDay=Math.round((new Date(slots.length?slots[slots.length-1].date:t0)-new Date(t0))/DAY);
  const waste=lots.filter(l=>l.bought&&l.amt>0.5&&l.exp<=lastDay+3).map(l=>({n:l.n,amt:r1(l.amt),exp:l.exp}));
  const meals=out.filter(x=>x.recipe).length;
  return {opts:o,created:Date.now(),slots:out.map(x=>({...x,done:false})),total,meals,buys,waste};
}

let sheetKind=null;
function anyModal(){return !!($("sheetHost").innerHTML||$("fullHost").innerHTML||!$("addSheet").hidden)}

// 휴대폰 뒤로 가기: 열린 창을 닫고, 다른 탭이면 추천 탭으로 (단독으로 열렸을 때만)
const HS={on:false,ignore:0,timer:null};
// 뒤로 가기 때 브라우저가 스크롤을 멋대로 옮기지 않게 (탭마다 위치는 앱이 기억)
if(TOP){try{if("scrollRestoration" in history)history.scrollRestoration="manual"}catch(e){}}
function needBack(){return anyModal()||prefs.tab!=="r"}
function histUpdate(){
  if(!TOP)return;clearTimeout(HS.timer);
  HS.timer=setTimeout(()=>{const need=needBack();
    if(need&&!HS.on){try{history.pushState({fridge:1},"");HS.on=true}catch(e){}}
    else if(!need&&HS.on){HS.on=false;HS.ignore++;try{history.back()}catch(e){HS.ignore--}}},0);
}
window.addEventListener("popstate",()=>{
  if(HS.ignore>0){HS.ignore--;return}
  HS.on=false;
  if(anyModal())closeTopModal();else if(prefs.tab!=="r")switchTab("r",true);

function closeTopModal(){

let tt=null,toastUndo=null;
function toast(t,undoFn,label,ms){
  const el=$("toast");toastUndo=undoFn||null;
  el.innerHTML=`<span>${esc(t)}</span>${undoFn?`<button type="button" data-act="toastUndo">${esc(label||"되돌리기")}</button>`:""}`;
  el.classList.toggle("top",anyModal());el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;toastUndo=null},ms||(undoFn?4500:2600));
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms||10)}catch(e){}};
const tabY={};
function switchTab(t,fromPop,restore){
  if(!["r","c","m","f"].includes(t))t="r";
  const prev=prefs.tab;
  if(prev===t&&restore&&!fromPop){window.scrollTo({top:0,behavior:"smooth"});return}
  if(prev&&prev!==t)tabY[prev]=window.scrollY;
  prefs.tab=t;savePrefs();
  for(const k of ["r","c","m","f"]){$("view-"+k).hidden=k!==t;$("tab-"+k).setAttribute("aria-selected",k===t)}
  render();
  window.scrollTo(0,(restore||fromPop)&&prev!==t?(tabY[t]||0):0);
  if(!fromPop)histUpdate();
}

// 요리 모드를 닫아도 계속 도는 타이머 (화면 아래 작은 알약 모양)
const fmtSec=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const Timer={
  end:0,total:0,label:"",iv:null,ac:null,done:false,
  start(sec,label){
    this.end=Date.now()+sec*1000;this.total=sec;this.label=label||"";this.done=false;
    try{this.ac=this.ac||new (window.AudioContext||window.webkitAudioContext)();if(this.ac.state==="suspended")this.ac.resume()}catch(e){}
    this.save();this.run();toast(`타이머 ${fmtSec(sec)} 시작${this.label?` · ${this.label}`:""}`);
  },
  run(){clearInterval(this.iv);this.iv=setInterval(()=>this.tick(),500);this.tick()},
  left(){return Math.max(0,Math.ceil((this.end-Date.now())/1000))},
  add(sec){if(!this.end||this.done){this.start(sec,this.label);return}this.end+=sec*1000;this.total+=sec;this.save();this.tick()},
  stop(){clearInterval(this.iv);this.iv=null;this.end=0;this.done=false;this.save();this.paint()},
  tick(){if(!this.end){this.paint();return}if(!this.done&&this.left()<=0){this.done=true;this.alarm()}this.paint()},
  paint(){
    const p=$("tpill");if(!p)return;const on=!!this.end;
    p.hidden=!on;document.body.classList.toggle("has-pill",on);
    const txt=this.done?"시간 됐어요":fmtSec(this.left());
    if(on){p.classList.toggle("done",this.done);p.innerHTML=`${ico("timer")}<b>${txt}</b>${this.label?`<span>${esc(this.label)}</span>`:""}`;p.setAttribute("aria-label",`타이머 ${txt}${this.label?` · ${this.label}`:""}`)}
    const ck=$("ckTimer");if(ck){ck.hidden=!on;ck.classList.toggle("done",this.done);ck.innerHTML=on?`<span class="tlb">타이머${this.label?` · ${esc(this.label)}`:""}</span>${txt}`:""}
    const ts=$("tsTime");if(ts)ts.textContent=on?txt:"꺼짐";
  },
  alarm(){
    buzz([300,150,300,150,300]);
    this.beep();setTimeout(()=>{if(this.done&&this.end)this.beep()},2500);
    toast(`${this.label?this.label+" · ":""}타이머가 끝났어요`);
  },
  beep(){try{const ac=this.ac;if(!ac)return;if(ac.state==="suspended")ac.resume();[0,0.35,0.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.22,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+0.28);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.3)})}catch(e){}},
  save(){prefs.timer=this.end?{end:this.end,total:this.total,label:this.label}:null;savePrefs()},
  restore(){const t=prefs.timer;if(!t||!t.end)return;const late=Date.now()-t.end;if(late>15*60*1000){prefs.timer=null;savePrefs();return}this.end=t.end;this.total=t.total||0;this.label=t.label||"";if(late>=0)this.done=true;this.run()}
};
function timerSheetHTML(){const on=!!Timer.end;return `<div class="shead"><h2>타이머${Timer.label?` · ${esc(Timer.label)}`:""}</h2><button class="ic" type="button" data-act="closeSheet" aria-label="닫기">×</button></div>
  <div class="timer" id="tsTime" style="text-align:center;font-size:60px;padding-block:6px">${on?(Timer.done?"시간 됐어요":fmtSec(Timer.left())):"꺼짐"}</div>
  <div class="acts" style="justify-content:center">${[[60,"+1분"],[180,"+3분"],[300,"+5분"]].map(([s,l])=>`<button class="btn" type="button" data-act="tAdd" data-v="${s}">${l}</button>`).join("")}</div>
  ${on?`<button class="btn wide danger" type="button" data-act="tStop">타이머 끄기</button>`:""}`}

const SORTS=[["best","추천순"],["cheap","이번 지출 적은 순"],["ready","재료 많이 있는 순"],["soon","임박 재료 먼저"],["health","영양 맞춤"],["quick","빨리 되는 순"]];
const FILTERS=[["quick","10분 이내"],["noFire","불 없이"],["oneTool","도구 하나로"],["hiP","단백질 25g+"],["light","500kcal 이하"],["lowNa","덜 짜게"],["onlyFav","즐겨찾기"],["onlyMine","내 레시피"]];
const FOCUS=[["ready","바로 가능"],["one","1~2개만 사면"],["soon","곧 상할 재료 쓰기"]];

const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ",CHOC=new Map();
function choOf(s){let v=CHOC.get(s);if(v===undefined){v="";for(const ch of s){const c=ch.charCodeAt(0)-0xAC00;v+=c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}CHOC.set(s,v)}return v}
const hasT=(s,t)=>/^[ㄱ-ㅎ]+$/.test(t)?choOf(s).includes(t):s.includes(t);
function recipeResults(ts){
  const Sv=prefs.servings,q=$("q").value.trim();
  const base=R.filter(r=>!avoided(r)).map(r=>analyze(r,Sv,ts));
  const typed=prefs.type==="전체"?base:base.filter(x=>x.r.type===prefs.type);
  let res=typed;
  if(prefs.focus==="ready")res=res.filter(x=>x.outlay===0);
  if(prefs.focus==="one")res=res.filter(x=>x.missing.length>=1&&x.missing.length<=2);
  if(prefs.focus==="soon")res=res.filter(x=>x.soon.length);
  if(prefs.onlyFav)res=res.filter(x=>x.fav);
  if(prefs.onlyMine)res=res.filter(x=>x.r.custom);
  if(prefs.noFire)res=res.filter(x=>!x.r.tools.some(t=>t==="팬"||t==="냄비"));
  if(prefs.oneTool)res=res.filter(x=>x.r.tools.filter(t=>t!=="밥솥").length<=1);
  if(prefs.quick)res=res.filter(x=>x.r.min<=10);
  if(prefs.hiP)res=res.filter(x=>x.n1.p>=25);
  if(prefs.light)res=res.filter(x=>x.n1.kcal<=500);
  if(prefs.lowNa)res=res.filter(x=>x.n1.na<=800);
  if(q){const terms=q.split(/[\s,]+/).filter(Boolean).map(t=>ALIAS[t]||t);res=res.filter(x=>terms.every(t=>hasT(x.r.name,t)||x.r.sub.includes(t)||x.r.ings.some(g=>hasT(g.n,t))))}
  const sorters={best:(a,b)=>a.rank-b.rank,cheap:(a,b)=>(a.outlay-b.outlay)||(a.real-b.real),ready:(a,b)=>(b.haveN/Math.max(1,b.req)-a.haveN/Math.max(1,a.req))||(a.outlay-b.outlay),soon:(a,b)=>(b.soon.length-a.soon.length)||(a.rank-b.rank),health:(a,b)=>(b.bonus-a.bonus)||(a.outlay-b.outlay),quick:(a,b)=>(a.r.min-b.r.min)||(a.rank-b.rank)};
  res.sort(sorters[prefs.sort]||sorters.best);
  return {base,typed,res};
}

function cartNeeds(){
  const want={},extra={};
  for(const c of S.cart){const r=RM[c.name];if(!r)continue;for(const g of r.ings){if(isGarnish(g)&&S.skipGarnish&&!(avail(g.n)>0))continue;want[g.n]=(want[g.n]||0)+g.a*c.serv}}
  for(const e of S.cartExtra)extra[e.n]=(extra[e.n]||0)+e.amt;
  // 냉장고 재고를 한 번씩만 쓰도록 나눠 쓰기 (대체 재료 포함)
  const pool={};for(const n of Object.keys(STOCK))pool[n]=STOCK[n].amt;
  const rows=[];
  for(const n of new Set([...Object.keys(want),...Object.keys(extra)])){
    const c=CM[n];if(!c||isPantry(n))continue;
    let need=want[n]||0;
    const own=Math.min(pool[n]||0,need);pool[n]=(pool[n]||0)-own;need-=own;
    if(need>1e-9&&S.allowSubs){for(const s of SUB[n]||[]){const c2=CM[s];if(!c2||c2.u!==c.u)continue;if(isPantry(s)){need=0;break}if((pool[s]||0)>=need-1e-9){pool[s]-=need;need=0;break}}}
    need=Math.max(0,need)+(extra[n]||0);
    if(need<=1e-9)continue;
    rows.push({c,need,bb:bestBuy(c,need)});
  }
  rows.sort((a,b)=>FGROUPS.indexOf(a.c.c)-FGROUPS.indexOf(b.c.c)||b.bb.cost-a.bb.cost);
  return rows;
}

let AI=null,AIimg=false,aiCtl=null;
async function initAI(){

    $("photoBtn").hidden=!AIimg;$("impPhotoBtn").hidden=!AIimg;if(AIimg&&lim.images.mediaTypes)$("impPhoto").accept=lim.images.mediaTypes.join(",");$("chefBox").hidden=false;renderBulk();

function aiErr(e){
  const c=e&&e.code;
  return c==="cancelled"?"":c==="not_granted"||c==="sampling_disabled"?"Claude 사용을 허락해야 쓸 수 있어요.":c==="rate_limited"?"요청이 많아요. 잠시 뒤에 다시 해주세요.":c==="image_rejected"?"이 사진은 읽을 수 없어요. 다른 사진으로 해주세요.":c==="refused"?"이 내용은 도와드릴 수 없어요.":c==="invalid_json"||c==="empty_completion"?"답을 정리하지 못했어요. 한 번 더 눌러주세요.":c==="session_expired"?"다시 로그인해주세요.":"지금은 연결이 안 돼요. 잠시 뒤에 다시 해주세요.";
}
const CAT_LIST=()=>CAT.map(c=>`${c.n}(${c.u})`).join(", ");
function aiItemsPrompt(kind){
  return `${kind}에서 식재료를 찾아 아래 '재료 목록'의 이름으로 정리해주세요.
규칙:
- name은 목록 이름 그대로. 비슷한 건 가장 가까운 이름으로 (예: 앞다리살→돼지고기, 달걀→계란, 비엔나→소시지, 쪽파→대파).
- amount는 그 재료의 단위(g 또는 개) 숫자. 양이 안 보이면 보통 한 팩 양으로 추정.
- price는 영수증처럼 그 품목 가격이 보이면 원 단위 숫자, 아니면 null.
- 목록에 없는 식재료는 others에 이름만. 식재료가 아닌 건 빼기.
답은 JSON 하나만: {"items":[{"name":"계란","amount":10,"price":null}],"others":[]}
재료 목록: ${CAT_LIST()}`;
}
function aiToBulk(res){
  const items=[];
  for(const it of (res&&Array.isArray(res.items)?res.items:[])){
    const n=CM[it.name]?it.name:matchName(String(it.name||""));if(!n)continue;
    let a=Number(it.amount);if(!(a>0))a=defaultAdd(n);
    const price=Number(it.price)>0?Math.round(Number(it.price)):null;
    const e=items.find(x=>x.n===n);if(e){e.amt=r1(e.amt+a);if(price)e.price=(e.price||0)+price}else items.push({n,amt:r1(a),on:true,price});
  }
  const others=(res&&Array.isArray(res.others)?res.others:[]).map(String).slice(0,10);
  return {items,unknown:others,record:items.some(x=>x.price),ai:true};
}

// 이 요리 하려고 사면 남는 재료로 이어서 만들 요리
function followUps(x,Sv){
  const lefts=x.missing.filter(m=>m.bb.left>0.5&&m.c.c!=="양념").map(m=>({n:m.c.n,amt:m.bb.left}));
  if(!lefts.length)return "";
  const saved=STOCK,st=JSON.parse(JSON.stringify(STOCK));
  for(const g of x.r.ings){const e=st[g.n];if(e)e.amt=Math.max(0,e.amt-g.a*Sv)}
  for(const l of lefts){const e=st[l.n]||(st[l.n]={amt:0,minD:CM[l.n].shelf});e.amt+=l.amt}
  let out=[];
  STOCK=st;
  try{
    const ts=todayState(),names=new Set(lefts.map(l=>l.n));
    out=R.filter(r=>r.name!==x.r.name&&!avoided(r)&&(S.rates[r.name]||0)>=0&&r.type!=="디저트"&&r.ings.some(g=>names.has(g.n)&&!isGarnish(g))).map(r=>analyze(r,1,ts)).sort((a,b)=>a.outlay-b.outlay||a.rank-b.rank).slice(0,4);
  }finally{STOCK=saved}
  if(!out.length)return "";
  return `<div class="subh">사고 남는 ${lefts.map(l=>esc(l.n)).join("·")}로 이어서 만들 요리</div><div class="chips">${out.map(y=>`<button class="chip" type="button" data-act="rsheet" data-r="${esc(y.r.name)}">${esc(y.r.name)} · ${y.outlay?`+${won(y.outlay)}원`:"추가 0원"}</button>`).join("")}</div>`;
}

};

/* =========================================================
   Claude: 유튜브·블로그 레시피를 내 레시피로 가져오기
   ========================================================= */
async function aiImport(file){
  if(!AI)return;
  const txt=$("impText").value.trim();
  if(!file&&!txt){toast("레시피 글을 붙여넣거나 캡처 사진을 골라주세요");return}
  const prompt=`${file?"사진 속":"아래"} 레시피를 한국 자취생 앱의 '내 레시피' 형식으로 바꿔주세요.
규칙:
- 재료 이름은 '재료 목록'에 있는 이름만 쓰고, 비슷한 건 가장 가까운 이름으로 바꿔요 (예: 달걀→계란, 쪽파→대파, 진간장→간장, 물엿→올리고당, 앞다리살→돼지고기, 비엔나→소시지). 목록에 없는 재료는 others에 이름만.
- 양은 그 재료 단위(g 또는 개)로 1인분 숫자. 원래 몇 인분인지 보고 1인분으로 나눠요. 숟가락은 무게로 바꿔요 (간장 1큰술 15g, 설탕 1큰술 12g, 고추장 1큰술 18g, 고춧가루 1큰술 7g, 다진마늘 1큰술 15g, 식용유 1큰술 13g, 1작은술은 1큰술의 1/3).
- 물은 재료에 넣지 말고 단계에 적어요.
- 도구는 팬, 냄비, 레인지, 밥솥, 토스터, 볼 중에서만. 오븐·에어프라이어·믹서가 필요하면 이 도구로 하는 방법으로 바꿔요.
- steps는 3~8개. 원문 문장을 그대로 옮기지 말고 짧게 다시 써요. 시간이 있으면 '5분 끓인다'처럼 숫자로.
- 레시피가 아니면 name을 빈 문자열로.
답은 JSON 하나만: {"name":"요리 이름","min":15,"type":"식사","tools":["팬"],"ings":[{"n":"계란","a":2}],"steps":["..."],"others":[]}
type은 식사, 라면, 반찬, 디저트 중 하나.
재료 목록: ${CAT_LIST()}
${file?"":`레시피 원문:\n"""${txt.slice(0,4000)}"""`}`;
  aiCtl&&aiCtl.abort();aiCtl=new AbortController();chefMode="import";
  openSheet(`<div class="shead"><h2>레시피 가져오기</h2><button class="ic" type="button" data-act="closeSheet" aria-label="닫기">×</button></div><div class="have">레시피를 읽고 1인분으로 바꾸고 있어요. 20~60초쯤 걸려요.</div><button class="btn" type="button" data-act="aiStop">그만</button>`);
  try{
    const res=await AI.json(prompt,{...(file?{images:[file]}:{}),cache:false,signal:aiCtl.signal});
    const nm=String(res&&res.name||"").trim().slice(0,30);
    if(!nm)throw {code:"not_recipe"};
    const others=Array.isArray(res.others)?res.others.map(String).slice(0,8):[];
    const r=toRecipe({...res,name:nm,why:others.length?`원문 재료 중 목록에 없어서 뺀 것: ${others.join(", ")}`:""});
    if(!r.ings.length||!r.steps.length)throw {code:"invalid_json"};
    if(RM[r.name]&&!S.custom.some(c=>c.name===r.name))r.name=(r.name+" (가져옴)").slice(0,30);
    chefRes=r;showChef();
  }catch(e){
    const m=e&&e.code==="not_recipe"?"레시피를 찾지 못했어요. 재료와 만드는 법이 들어간 글이나 캡처로 해주세요.":aiErr(e);
    if(m)openSheet(`<div class="shead"><h2>레시피 가져오기</h2><button class="ic" type="button" data-act="closeSheet" aria-label="닫기">×</button></div><div class="have">${esc(m)}</div>`);else closeSheet();
  }
  $("impPhoto").value="";
}

  addItem(name,amt,{bought:$("fBought").value,expiry:$("fExp").value});
  persist();render();toast(`${name} ${fmtAmt(amt,CM[name]?CM[name].u:"g")} 넣었어요`,undo);
  $("fName").value="";$("fAmt").value="";$("fExp").value="";$("fBought").value=todayStr();syncForm();$("fName").focus();
});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t&&t.dataset&&t.dataset.askq!=null){e.preventDefault();const b=t.closest(".ask").querySelector("[data-act=askR]");b&&b.click()}});
let qT=null;$("q").addEventListener("input",()=>{clearTimeout(qT);qT=setTimeout(()=>{shown=30;render()},150)});

/* ========= 시작 ========= */
document.querySelectorAll("[data-ic]").forEach(el=>el.insertAdjacentHTML("afterbegin",ico(el.dataset.ic)));
$("setBtn").innerHTML=ico("gear");
$("fab").innerHTML=`${ico("plus")}<span>재료 넣기</span>`;
$("qIco").outerHTML=ico("search","sico");
applyTheme();
(()=>{const tb=document.querySelector(".tabs");const set=()=>{const h=tb.offsetHeight;if(h)document.documentElement.style.setProperty("--tabh",h+"px")};set();if("ResizeObserver" in window)new ResizeObserver(set).observe(tb);else addEventListener("resize",set)})();
syncForm();
Timer.restore();
if("IntersectionObserver" in window)moreIO=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting&&!$("moreBtn").hidden&&prefs.tab==="r"){shown+=30;buildStock();renderRecipes(todayState())}},{rootMargin:"600px 0px"});
switchTab(["r","c","m","f"].includes(prefs.tab)?prefs.tab:"r",true);
histUpdate();
initCloud();
initAI();
$("photoIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)aiPhoto(f)});
$("impPhoto").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)aiImport(f)});
// 검색창: 최근 검색어·냉장고 재료 제안
(()=>{const q=$("q");
  q.addEventListener("focus",renderSuggest);
  q.addEventListener("input",()=>{$("qClear").hidden=!q.value;renderSuggest()});
  q.addEventListener("blur",()=>{setTimeout(()=>{if(document.activeElement!==q)$("qSuggest").hidden=true},200);addRecent(q.value)});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addRecent(q.value);q.blur()}});
})();
// 스크롤하면 제목 아래 줄
addEventListener("scroll",()=>$("hdr").classList.toggle("sh",window.scrollY>4),{passive:true});
// 키보드가 올라오면 아래 탭·떠 있는 버튼 숨기기
if(matchMedia("(pointer:coarse)").matches){
  const field=t=>t&&t.matches&&t.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=date]),textarea');
  document.addEventListener("focusin",e=>{if(field(e.target))document.body.classList.add("kb")});
  document.addEventListener("focusout",()=>setTimeout(()=>{if(!field(document.activeElement))document.body.classList.remove("kb")},60));
}
// 아래에서 올라온 창은 끌어내리면 닫혀요
(()=>{let s0=null,y0=0,dy=0;
  document.addEventListener("touchstart",e=>{const sh=e.target.closest&&e.target.closest(".scrim .sheet");if(!sh)return;const head=e.target.closest(".stk,.sgrab,.shead");if(sh.scrollTop>2&&!head)return;if(e.target.closest("input,textarea,select,.scroller")&&!head)return;s0=sh;y0=e.touches[0].clientY;dy=0},{passive:true});
  document.addEventListener("touchmove",e=>{if(!s0)return;dy=e.touches[0].clientY-y0;if(dy>0&&s0.scrollTop<=0){s0.style.transition="none";s0.style.transform=`translateY(${dy}px)`}else if(dy<=0)s0.style.transform=""},{passive:true});
  document.addEventListener("touchend",()=>{if(!s0)return;const sh=s0;s0=null;sh.style.transition="transform .18s ease-out";
    if(dy>110){sh.style.transform="translateY(110%)";setTimeout(()=>{sh.style.transform="";sh.style.transition="";if(sh.closest("#addSheet"))closeAdd();else closeSheet()},170)}else sh.style.transform="";dy=0},{passive:true});
})();
// 요리 모드: 화면을 옆으로 밀면 단계 이동
(()=>{let sx=0,sy=0,on=false;const h=$("fullHost");
  h.addEventListener("touchstart",e=>{on=false;if(!h.querySelector(".cooknav")||e.touches.length!==1||e.target.closest("button,input,label,.seg"))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;on=true},{passive:true});
  h.addEventListener("touchend",e=>{if(!on)return;on=false;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<60&&Cook.r){if(dx<0){if(Cook.i<Cook.r.steps.length)ACT.ckNext()}else if(Cook.i>-1)ACT.ckPrev()}},{passive:true});
})();
// 다시 보면: 날짜가 바뀌었을 수 있으니 다시 그리고, 화면 켜짐 유지
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;Timer.tick();if($("fullHost").querySelector(".cooknav")&&navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>{Cook.lock=l}).catch(()=>{});if(!anyModal())render()});
// 바로가기 주소 (#add 재료 넣기, #shop 장보기, #plan 식단, #log 먹은 것 기록, #fridge 냉장고, #now 추천)
function handleHash(){
  const h=(location.hash||"").slice(1);if(!h)return;
  if(h==="now")switchTab("r");
  else if(h==="add"){switchTab("f");openAdd()}
  else if(h==="shop"){prefs.cview="cart";switchTab("c")}
  else if(h==="plan"){prefs.cview="plan";switchTab("c")}
  else if(h==="log"){switchTab("m");openPick()}
  else if(h==="fridge")switchTab("f");
  else return;
  if(TOP){try{history.replaceState(history.state,"",location.pathname+location.search)}catch(e){}}
}
window.addEventListener("hashchange",handleHash);
handleHash();
// 설치한 앱은 저장 공간을 지우지 말아 달라고 요청
if(TOP&&navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>{if(!p&&(STANDALONE||S.items.length>3))navigator.storage.persist().catch(()=>{})}).catch(()=>{})}
if(STANDALONE&&!prefs.installed){prefs.installed=true;savePrefs()}
if(firstRun&&!prefs.seenIntro)showIntro();

</script>

<script>
/* 오프라인 저장 + 새 버전 알림 */
(()=>{const BUILD="8f2a11ed88";if(!("serviceWorker" in navigator))return;
  const had=!!navigator.serviceWorker.controller;let told=false;
  navigator.serviceWorker.addEventListener("message",e=>{const d=e.data||{};
    if(d.type==="sw-ready"&&d.v!==BUILD&&had&&!told){told=true;try{toast("새 버전이 준비됐어요",()=>location.reload(),"새로고침",9000)}catch(_){}}});
  addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    let last=Date.now();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-last>18e5){last=Date.now();reg.update().catch(()=>{})}});
  }).catch(()=>{})});
})();
</script>
